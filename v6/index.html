<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lapis v6 — browser</title>
  <link rel="stylesheet" href="./demo.css" />
  <script type="importmap">
  {
    "imports": {
      "@bjorn3/browser_wasi_shim": "./vendor/browser_wasi_shim/index.js"
    }
  }
  </script>
</head>
<body>
  <main>
    <h1>Lapis</h1>
    <p class="lede">FizzBuzz and Wordle on the bundled WebAssembly host. Wordle guesses go through stdin.</p>

    <div class="actions samples">
      <button type="button" id="sample-fizz" class="ghost">FizzBuzz sections</button>
      <button type="button" id="sample-wordle" class="ghost selected">Wordle</button>
    </div>

    <label class="field">
      <span>argv</span>
      <textarea id="argv" rows="3" spellcheck="false">wordle play</textarea>
    </label>

    <label class="field">
      <span>stdin</span>
      <textarea id="stdin" rows="4" spellcheck="false" placeholder="one line per stdin read (Wordle guesses)">train
brain
</textarea>
    </label>

    <div class="actions">
      <button type="button" id="run">Run</button>
    </div>

    <pre id="out" aria-live="polite"></pre>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
