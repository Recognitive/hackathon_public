# Lapis

> **BETA — EARLY AND INCOMPLETE**
>
> This is an exploratory sketch of Lapis (v4), not a finished language. Syntax, semantics, the host, and these notes are provisional. Expect gaps, inventions, and breaking changes. Do not treat this as a stable specification or production API.

Lapis is Recognitive’s modelled language: data, behaviour, metadata, errors, and reflection share one typed substrate. Grammars express models; models define the language. See the [Supersoftware white paper](https://github.com/Recognitive/docs/blob/main/Supersoftware-white-paper.md) and [architectural notes](https://share.note.sx/e2fgkw3b).

File roles: `.lps` declares models and experts; `.lson` carries typed values (LSON / Recognitive Notation).

---

## Foundations

### Why these shapes

Ordinary software scatters meaning across code, configs, schemas, and wire formats that cannot inspect each other. Lapis collapses that into one reflective model so a system can reason about itself and exchange that reasoning intact — *exo-homoiconicity*, not merely “code is data.”

**Models define the language; grammars only project it.** Syntax is a disposable surface. Evolve how you write Lapis; the model remains the shared, inspectable contract tools and LLMs can read. That is *not* “models own meaning”: meaning still depends on who interprets the model (see below). Models carry the distinctions; receivers still do the interpreting.

```lps
# Alias/Positional are model data — the CLI parser learns the command line from them
@Alias {name: 'add'}
entity AddTask { priority: Priority }
```

**Denote values before running them.** An invocation is an entity you can store, validate, or ship; an expert supplies behaviour later. The host need not understand the domain.

```lps
entity FizzBuzz: Result { inputs: list<integer> }
# `fizz-buzz --inputs 1 2` builds this value; evaluation is optional and separate
```

**Failures are values.** No exceptions: `Reason` / `Failure` travel like any other entity, so many independent errors can surface together and stay located.

```lps
expert function wordle(evaluable: Wordle): Maybe<Board> {
  return InvalidValue { text: "Too many guesses" }  # → Maybe.empty
}
```

**Two reflections, one loop.** Modelled reflection (`EntityType`, …) is exchangeable data; behavioural reflection is the host’s `create` / `get` / `set`. Declarations become data, then deploy into behaviour — so types can also be built from data alone.

```lps
Reflection.deploy(Model { name: 'fixture:ghost', types: set<Type> [ghost] })
```

**Steps instead of lambdas.** Composition (`Apply`, `Bind`, `Map`) is itself model data, so pipelines stay serialisable and type-checkable.

```lps
return Map(outcome: Check(value: evaluable), next: ClassifyInputs {})
```

**Keep domains thin.** Parsing, views, and validation live in separate models so a domain declares *what* without owning the CLI or presentation.

```lson
< RunCommandLine { domains: ['example:wordle'], view: TextView {} }
```

### Models carry the world

The distinctions a domain needs — types, metadata, evaluables, reasons, views — live in Lapis models, so they can be reflected, exchanged, and checked without asking the runtime. The host supplies only the *machine edge*: bytes, clocks, argv, process exit. It must not encode domain vocabulary; if the host knew what a `Priority` or a `Board` was, swapping hosts or tooling would fork the world model.

Consequences: CLI shape comes from `@Alias` / `@Positional`, not from host switches; decode and locate errors in Lapis; presentation is a `View` step, not `println` in the bootstrap. The host’s job is to bind externals, deploy reflection, evaluate whatever the document emits, and print the lines a view returns.

```lps
# The model carries what "add high" denotes
@Alias {name: 'add'}
entity AddTask { priority: Priority = Priority.medium }

# Edge: the host only injects argv and writes the view's strings
# < RunCommandLine { args: $args, domains: ['example:tasks'] }
```

### Information is not meaning

[Shannon’s model](https://en.wikipedia.org/wiki/A_Mathematical_Theory_of_Communication) accounts for *information*: a signal selected from a set of possible signals, sent through a channel, recovered at a receiver. It is silent on *meaning*. A bit string can arrive intact and still mean nothing — or mean different things — depending on who receives it and in what shared world they stand.

Meaning is subjective and bound to interpretation. It depends on context and on the receiver’s models: prior types, vocabulary, purposes, and the distinctions they know how to draw. The same tokens `high` or `Board { won: true }` are only significant once a participant can place them in a type, a domain, a use.

Lapis does not encode a universal semantics. It facilitates interpretation: a shared, reflective substrate so senders and receivers can align (or deliberately diverge) their models — `%model`, typed values, metadata, reasons — and make that alignment itself inspectable. Exo-intelligence needs channels *and* legible context; Lapis is the latter.

```lson
%model example:tasks#[0.1,0.2)
# Channel delivers text; meaning starts when the receiver's model binds it
< AddTask { priority: high }
```

---

## Concepts

### Host

The **host** is the runtime process that loads Lapis and performs what models cannot: read files and argv, deploy behavioural reflection (`create`, `get`/`set`, `parse`), bind `$name` externals, evaluate experts, and write stdout/stderr. Models carry the world; the host owns the machine edge. In v4 that host is the Rust bootstrap (`./lapis`). It stays domain-blind — a command is just an emitted evaluable plus a view.

```lson
%lson 0.1
%model hackathon:cli-run#[0.1,0.2)

# $args is supplied by the host; everything else is Lapis
< RunCommandLine { args: $args, domains: ['example:tasks'] }
```

---

### Models

A named package of types. `%model` pulls a dependency; `id` is how domains are addressed.

```lps
%model hackathon:cli-metadata#[0.1,0.2)

model Tasks @lson {
  id: 'example:tasks',
  stability: 'evolving'
} {
  enum Priority { low, medium, high }
  entity AddTask {
    priority: Priority = Priority.medium
  }
}
```

---

### Entities & enums

Entities are identity-bearing records. Enums are model-defined scalars. Inheritance uses `extends`.

```lps
abstract entity Condition extends Step: boolean {
  input: integer
}

entity DivisibleBy extends Condition: boolean {
  divisor: integer
}
```

---

### Evaluables & experts

`entity Name: T` means the entity *evaluates to* `T`. An `expert function` binds behaviour to that type. Evaluation is data-first: build the value, then run it.

```lps
entity ScoreGuess: ScoredGuess {
  secret: string
  guess: string
}

expert function scoreGuess(evaluable: ScoreGuess): ScoredGuess {
  return ScoredGuess { guess: evaluable.guess, tiles: list<Tile> [] }
}
```

Call as `ScoreGuess(secret: s, guess: g)` or `step()`.

---

### LSON documents

Preamble declares version and models. Bindings pool values; `< value` emits. `$name` is a host binding.

```lson
%lson 0.1
%model hackathon:cli-run#[0.1,0.2)

< RunCommandLine {
  args: $args,
  domains: ['example:wordle'],
  view: TextView {}
}
```

---

### Type system

Scalars (`boolean`, `string`, `integer`, …), collections (`list<T>`, `set<T>`, `map<K,V>`), `typeref<T>`, and unions. Model generics stay reduced to those four forms.

```lps
type Option = Some | None
type Result = Some | Failure

entity FizzBuzz: Result {
  inputs: list<integer>
  rules: list<Rule> = list<Rule> [
    Rule { label: 'Fizz', when: DivisibleBy { divisor: 3 } }
  ]
}
```

---

### Metadata

`@Type { … }` before a declaration is a `MetaData` entity. Cascading resolution picks what applies (element → property type → supertypes), filtered by selectors.

```lps
@Positional {properties: [~AddTask.priority]}
@Alias {name: 'add'}
entity AddTask {
  @Alias {name: 'prio'}
  priority: Priority = Priority.medium
}
```

---

### ~ refs

`~Type.property` is a **load-time** reference into the modelled meta-model. Where the expected type is `Property` (as in `Positional.properties`), it resolves to that `Property` entity. Elsewhere it yields a *locus* (a typed location). A wrong name fails the load — metadata cannot silently point at nothing.

```lps
# Resolves to the Property instance for AddTask.priority
@Positional {properties: [~AddTask.priority]}

entity DivisibleBy extends Condition: boolean {
  @Minimum {value: 1}   # metadata on the property; ~ not needed here
  divisor: integer
}
```

Contrast: `$args` is a host binding at run time; `?FileResource` is behavioural reflection. Only `~` is checked against declarations before any argv is read.

---

### Reflection (the strange loop)

| Side | What | Reach |
|------|------|-------|
| Modelled | `EntityType`, `Property`, `Model` as data | `Models.find`, `.manifest()` |
| Behavioural | Host deploy: `create`, `get`/`set`, `parse` | `Reflection`, `?Name` |

Declaration → modelled instance → deploy → behavioural type. Types can be built from data alone.

```lps
let ghost = EntityType { typeSignature: 'Ghost' }
ghost.properties.add(Property {
  name: 'label', type: text.manifest(), declaringType: ghost
})
Reflection.deploy(Model { name: 'fixture:ghost', types: set<Type> [ghost] })
```

---

### Outcomes

No exceptions. `Option` is presence; `Result`/`Maybe` is success-or-reasons. Returning a `Reason` from a `Maybe`-typed expert is failure.

```lps
expert function wordle(evaluable: Wordle): Maybe<Board> {
  if (evaluable.guesses.size > 5) {
    return InvalidValue { text: "Too many guesses" }
  }
  return Board { rows: rows, won: won }
}
```

```lps
match parsed {
  Failure as failed { /* use failed.reasons */ }
  Some as ok { /* use ok.value */ }
}
```

---

### Steps & chaining

`Step` is a partial evaluable (input filled later). `Apply` / `Bind` / `Map` compose without lambdas.

```lps
expert function fizzBuzz(evaluable: FizzBuzz): Result {
  return Map(outcome: Check(value: evaluable), next: ClassifyInputs {})
}

expert function divisibleBy(evaluable: DivisibleBy): boolean {
  return evaluable.input % evaluable.divisor == 0
}
# Apply(step: rule.when, input: number) fills Condition.input, then evaluates
```

---

### CLI as model

Argv denotes entities. Metadata (`Positional`, `Alias`) shapes the command line; the host only binds `$args` and prints the view.

```text
./lapis tasks add high
# → AddTask { priority: Priority.high }
```

```lps
entity RunCommandLine: CommandResult {
  args: list<string>
  domains: list<string>
  evaluator: CliEvaluator
  view: Step
}
```

---

### Control flow (sketch)

`let`, `if`, `for`/`while`, `match`, property mutation, string interpolation. Checked at load where possible (expert signatures, `match` exhaustiveness, `~` refs).

```lps
for guess in evaluable.guesses {
  let scored = ScoreGuess(secret: secret, guess: guess)
  rows.add(scored)
}
return "${row.guess} ${marks}"
```

---

## Zen of Lapis

- Beautiful is better than clever — when the model can say it.
- Models define the language; grammars only wear it.
- The host moves bytes; the model carries the world.
- Information arrives; meaning is interpreted.
- Denote first. Evaluate when you must.
- A value you can ship beats a call you cannot name.
- Failure is a value. Silence is not an error report.
- Steps compose; closures hide.
- Metadata is data. Reflection is ordinary.
- Two mirrors, one loop: declare, deploy, become.
- Thin domains. Fat hosts are a smell.
- `~` fails at load. Wishful metadata does not.
- Prefer one substrate to many formats that cannot see each other.
- Explicit models beat implicit convention — except when the model *is* the convention.
- There should be one obvious place for a distinction — in a model someone else can read.
- Namespaces are cheap. Forked world-models are not.
- If the LLM cannot inspect it, you will explain it forever.
- Provisional is fine. Pretending it is finished is not.

(function () {
  const KEYWORDS = new Set([
    'model', 'entity', 'enum', 'expert', 'function', 'abstract', 'extends',
    'type', 'let', 'if', 'for', 'while', 'match', 'return', 'in', 'as',
    'true', 'false', 'null'
  ]);
  const TYPES = new Set([
    'boolean', 'string', 'integer', 'long', 'decimal', 'float', 'double',
    'date', 'list', 'set', 'map', 'typeref', 'Base', 'Maybe', 'Option', 'Result'
  ]);
  const TWO_CHAR = ['==', '!=', '<=', '>=', '&&', '||'];

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function span(cls, text) {
    return '<span class="tok-' + cls + '">' + esc(text) + '</span>';
  }

  /** Lapis highlighter — aligned with autocomplete/server/src/lexer.js */
  function highlightLapis(src) {
    let out = '';
    let i = 0;
    const n = src.length;
    let lineStart = true;

    while (i < n) {
      const c = src[i];

      if (c === '\n') {
        out += '\n';
        i += 1;
        lineStart = true;
        continue;
      }
      if (c === ' ' || c === '\t' || c === '\r') {
        out += c;
        i += 1;
        continue;
      }

      // line comment
      if (c === '#') {
        const s = i;
        while (i < n && src[i] !== '\n') i += 1;
        out += span('cm', src.slice(s, i));
        continue;
      }

      // directive at line start: %model, %lson, …
      if (c === '%' && lineStart) {
        const s = i;
        while (i < n && src[i] !== '\n') i += 1;
        out += span('dir', src.slice(s, i));
        continue;
      }
      lineStart = false;

      // annotation @Name
      if (c === '@' && /[A-Za-z_]/.test(src[i + 1] || '')) {
        const s = i;
        i += 1;
        while (i < n && /[A-Za-z0-9_]/.test(src[i])) i += 1;
        out += span('ann', src.slice(s, i));
        continue;
      }

      // ~Type.property, $host, ?Type
      if ((c === '~' || c === '$' || c === '?') && /[A-Za-z_]/.test(src[i + 1] || '')) {
        const s = i;
        i += 1;
        while (i < n && /[A-Za-z0-9_.]/.test(src[i])) i += 1;
        out += span('ref', src.slice(s, i));
        continue;
      }

      // strings / templates
      if (c === "'" || c === '"') {
        const quote = c;
        const s = i;
        i += 1;
        while (i < n) {
          if (src[i] === '\\') { i += 2; continue; }
          if (src[i] === quote) { i += 1; break; }
          if (src[i] === '\n' && quote === "'") break;
          i += 1;
        }
        out += span(quote === '"' ? 'tpl' : 'str', src.slice(s, Math.min(i, n)));
        continue;
      }

      // numbers (optional type suffix: 3i, 1.0d)
      if (/[0-9]/.test(c)) {
        const s = i;
        while (i < n && /[0-9]/.test(src[i])) i += 1;
        if (src[i] === '.' && /[0-9]/.test(src[i + 1] || '')) {
          i += 1;
          while (i < n && /[0-9]/.test(src[i])) i += 1;
        }
        while (i < n && /[A-Za-z]/.test(src[i])) i += 1;
        out += span('num', src.slice(s, i));
        continue;
      }

      // identifiers / keywords / types
      if (/[A-Za-z_]/.test(c)) {
        const s = i;
        while (i < n && /[A-Za-z0-9_]/.test(src[i])) i += 1;
        const id = src.slice(s, i);
        if (KEYWORDS.has(id)) out += span('kw', id);
        else if (TYPES.has(id)) out += span('type', id);
        else out += span('id', id);
        continue;
      }

      const two = src.slice(i, i + 2);
      if (TWO_CHAR.includes(two)) {
        out += span('punct', two);
        i += 2;
        continue;
      }

      out += span('punct', c);
      i += 1;
    }
    return out;
  }

  function highlightText(src) {
    let out = '';
    let i = 0;
    const n = src.length;
    while (i < n) {
      if (src[i] === '#') {
        const s = i;
        while (i < n && src[i] !== '\n') i += 1;
        out += span('cm', src.slice(s, i));
        continue;
      }
      out += esc(src[i]);
      i += 1;
    }
    return out;
  }

  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
  }

  function slugify(text) {
    return text.toLowerCase()
      .replace(/&[^;]+;/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '');
  }

  function renderMarkdown(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    let inTable = false;
    let lastHeading = '';
    const toc = [];
    const usedIds = Object.create(null);

    function closeTable() {
      if (inTable) { html += '</tbody></table>'; inTable = false; }
    }

    function uniqueId(base) {
      let id = base || 'section';
      if (usedIds[id]) {
        let n = 2;
        while (usedIds[id + '-' + n]) n += 1;
        id = id + '-' + n;
      }
      usedIds[id] = true;
      return id;
    }

    while (i < lines.length) {
      const line = lines[i];

      // fenced code
      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        closeTable();
        const lang = fence[1] || 'text';
        i += 1;
        const body = [];
        while (i < lines.length && !lines[i].startsWith('```')) {
          body.push(lines[i]);
          i += 1;
        }
        i += 1; // closing fence
        const src = body.join('\n');
        const highlighted = (lang === 'lps' || lang === 'lson')
          ? highlightLapis(src)
          : highlightText(src);
        html += '<pre><span class="lang-tag">' + esc(lang) + '</span><code class="language-' +
          esc(lang) + '">' + highlighted + '</code></pre>\n';
        continue;
      }

      // horizontal rule
      if (/^---+\s*$/.test(line)) {
        closeTable();
        html += '<hr>\n';
        i += 1;
        continue;
      }

      // headings
      const h = line.match(/^(#{1,3})\s+(.+)$/);
      if (h) {
        closeTable();
        const level = h[1].length;
        const raw = h[2];
        const text = inline(raw);
        lastHeading = raw;
        if (level === 1) {
          html += '<header id="top"><p class="brand">Recognitive language · beta</p><h1>' +
            text + '</h1></header>\n';
        } else {
          const id = uniqueId(slugify(raw));
          toc.push({ id: id, title: raw, level: level });
          html += '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>\n';
        }
        i += 1;
        continue;
      }

      // table
      if (line.includes('|') && line.trim().startsWith('|')) {
        const cells = line.split('|').slice(1, -1).map((c) => c.trim());
        const next = lines[i + 1] || '';
        const isSep = /^\|[\s:|-]+\|$/.test(next.trim()) ||
          /^\|?[\s|:-]+\|?$/.test(next.trim());

        if (!inTable) {
          html += '<table><thead><tr>';
          cells.forEach((c) => { html += '<th>' + inline(c) + '</th>'; });
          html += '</tr></thead><tbody>\n';
          inTable = true;
          i += 1;
          if (isSep) i += 1;
          continue;
        }
        html += '<tr>';
        cells.forEach((c) => { html += '<td>' + inline(c) + '</td>'; });
        html += '</tr>\n';
        i += 1;
        continue;
      }

      if (inTable && !line.includes('|')) closeTable();

      // blank
      if (!line.trim()) {
        i += 1;
        continue;
      }

      // unordered list
      if (/^[-*]\s+/.test(line)) {
        closeTable();
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^[-*]\s+/, ''));
          i += 1;
        }
        const zen = /^Zen of Lapis$/i.test(lastHeading);
        html += '<ul' + (zen ? ' class="zen"' : '') + '>\n';
        items.forEach(function (t) {
          html += '<li>' + inline(t) + '</li>\n';
        });
        html += '</ul>\n';
        continue;
      }

      // blockquote (beta callout or ordinary)
      if (line.startsWith('>')) {
        closeTable();
        const quoteLines = [];
        while (i < lines.length && lines[i].startsWith('>')) {
          quoteLines.push(lines[i].replace(/^>\s?/, ''));
          i += 1;
        }
        const joined = quoteLines.join('\n').trim();
        const isBeta = /\bBETA\b/i.test(joined);
        if (isBeta) {
          const parts = joined.split(/\n\s*\n/);
          const label = parts[0].replace(/\*\*/g, '');
          const bodyText = parts.length > 1 ? parts.slice(1).join(' ') : '';
          html += '<aside class="beta-banner" role="status"><span class="beta-label">' +
            esc(label) + '</span>';
          if (bodyText) html += '<p>' + inline(bodyText) + '</p>';
          html += '</aside>\n';
        } else {
          html += '<blockquote><p>' + inline(joined.replace(/\n+/g, ' ')) + '</p></blockquote>\n';
        }
        continue;
      }

      // paragraph (merge consecutive non-blank, non-special lines)
      const parts = [line];
      i += 1;
      while (i < lines.length) {
        const nline = lines[i];
        if (!nline.trim()) break;
        if (/^#{1,3}\s/.test(nline) || nline.startsWith('```') ||
            /^---+\s*$/.test(nline) || nline.trim().startsWith('|') ||
            nline.startsWith('>') || /^[-*]\s+/.test(nline)) break;
        parts.push(nline);
        i += 1;
      }
      html += '<p>' + inline(parts.join(' ')) + '</p>\n';
    }
    closeTable();
    return { html: html, toc: toc };
  }

  function buildToc(entries) {
    const nav = document.getElementById('toc');
    nav.innerHTML = entries.map(function (e) {
      return '<a class="toc-h' + e.level + '" href="#' + e.id + '" data-id="' + e.id + '">' +
        esc(e.title) + '</a>';
    }).join('');
  }

  function watchActive(entries) {
    const links = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
    if (!entries.length || !('IntersectionObserver' in window)) return;

    const byId = Object.create(null);
    links.forEach(function (a) { byId[a.getAttribute('data-id')] = a; });

    let current = null;
    function setActive(id) {
      if (current === id) return;
      current = id;
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('data-id') === id);
      });
    }

    const observer = new IntersectionObserver(function (obs) {
      const visible = obs
        .filter(function (e) { return e.isIntersecting; })
        .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-10% 0px -70% 0px', threshold: [0, 1] });

    entries.forEach(function (e) {
      const el = document.getElementById(e.id);
      if (el) observer.observe(el);
    });

    if (entries[0]) setActive(entries[0].id);
  }

  const md = document.getElementById('md').textContent.replace(/^\n/, '');
  const rendered = renderMarkdown(md);
  document.getElementById('doc').innerHTML = rendered.html;
  buildToc(rendered.toc);
  watchActive(rendered.toc);
})();
</script>
</body>
</html>
